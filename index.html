<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jul Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="main-container">
        <div class="calculator-container">
            <form>
                <div class="display">
                    <input type="text" name="display" id="display">
                </div>
                <div>
                    <input type="button" value="AC" id="clear">
                    <input type="button" value="+/-">
                    <input type="button" value="%" id="modulus">
                    <input type="button" value="/" id="divide">
                </div>
                <div>
                    <input type="button" value="7">
                    <input type="button" value="8">
                    <input type="button" value="9">
                    <input type="button" value="*" id="multiply">
                </div>
                <div>
                    <input type="button" value="4">
                    <input type="button" value="5">
                    <input type="button" value="6">
                    <input type="button" value="-" id="subtract">
                </div>
                <div>
                    <input type="button" value="1">
                    <input type="button" value="2">
                    <input type="button" value="3">
                    <input type="button" value="+" id="addition">
                </div>
                <div class="bottom">
                    <input type="button" value="0" id="zero">
                    <input type="button" value="." id="decimal">
                    <input type="button" value="=">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
